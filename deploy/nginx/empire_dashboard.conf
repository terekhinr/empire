# Streamlit «Око Саурона» — внешний доступ (аналог прокси gdepar.ru).
# Поддомен: hub.neverretire.ru (DNS A/AAAA на VPS).
#
# Первый выпуск сертификата:
#   sudo certbot certonly --webroot -w /var/www/certbot -d hub.neverretire.ru
#
# Пароль:
#   sudo ./scripts/gen_dashboard_htpasswd.sh admin 'ВАШ_ПАРОЛЬ'
#
# Подключение в nginx:
#   sudo ln -sf /root/projects/empire/deploy/nginx/empire_dashboard.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

map $http_x_forwarded_proto $dash_is_https {
    default 0;
    "https" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name hub.neverretire.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        if ($dash_is_https = 0) {
            return 301 https://$host$request_uri;
        }
        include /root/projects/empire/deploy/nginx/empire_dashboard_locations.inc;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hub.neverretire.ru;

    ssl_certificate /etc/letsencrypt/live/hub.neverretire.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.neverretire.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /root/projects/empire/deploy/nginx/empire_dashboard_locations.inc;
}
