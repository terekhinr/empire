# pay.neverretire.ru → empire_sales (webhook YooKassa)
# Подключить: include в /etc/nginx/sites-enabled/ или certbot:
#   certbot certonly --webroot -w /var/www/certbot -d pay.neverretire.ru

server {
    listen 80;
    listen [::]:80;
    server_name pay.neverretire.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        if ($is_https_request = 0) {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

