# Empire — Mushroom + Mini Graph (стиль gendom.ru)
# Требует: lovelace-mushroom, mini-graph-card в lovelace_resources

title: Empire
views:
  - title: Дом
    path: home
    icon: mdi:home-heart
    theme: default
    cards:
      - type: custom:mushroom-title-card
        title: Empire
        subtitle: "{{ now().strftime('%A, %d %B') }}"
      - type: custom:mini-graph-card
        name: Климат на балконе
        icon: mdi:thermometer
        hours_to_show: 24
        points_per_hour: 2
        line_width: 2
        show:
          legend: true
          fill: fade
        entities:
          - entity: sensor.balkon_temperatura
            name: t°
            color: "#ff7043"
          - entity: sensor.balkon_vlazhnost
            name: влажность
            color: "#42a5f5"
            y_axis: secondary
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.sber_th_temperatura
            name: Кухня
            icon: mdi:stove
            layout: vertical
          - type: custom:mushroom-entity-card
            entity: sensor.balkon_temperatura
            name: Балкон
            icon: mdi:home-thermometer-outline
            layout: vertical
          - type: custom:mushroom-entity-card
            entity: sensor.balkon_vlazhnost
            name: Влажность
            icon: mdi:water-percent
            layout: vertical
          - type: custom:mushroom-entity-card
            entity: sensor.balkon_batareia
            name: Батарея
            icon: mdi:battery-40
            layout: vertical
      - type: custom:mushroom-title-card
        title: Режимы
        subtitle: Быстрые сценарии
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: input_boolean.rezhim_noch
            name: Ночь
            icon: mdi:weather-night
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: input_boolean.rezhim_ushel
            name: Ушёл
            icon: mdi:home-export-outline
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: input_boolean.rezhim_deti_spiat
            name: Дети спят
            icon: mdi:sleep
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: input_boolean.rezhim_otpusk
            name: Отпуск
            icon: mdi:airplane
            tap_action:
              action: toggle
      - type: custom:mushroom-title-card
        title: Свет
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-light-card
            entity: light.empire_kuhnya_svet
            name: Кухня
            icon: mdi:ceiling-light
            use_light_color: true
            show_brightness_control: false
          - type: custom:mushroom-light-card
            entity: light.empire_vannaya_svet
            name: Ванная
            icon: mdi:shower-head
            use_light_color: true
            show_brightness_control: true
          - type: custom:mushroom-light-card
            entity: light.empire_tualet_svet
            name: Туалет
            icon: mdi:toilet
            use_light_color: true
            show_brightness_control: false
          - type: custom:mushroom-light-card
            entity: light.empire_prihozhaya_svet
            name: Прихожая
            icon: mdi:door
            use_light_color: true
            show_brightness_control: false
          - type: custom:mushroom-entity-card
            entity: switch.spalnya_svet
            name: Спальня 1
            icon: mdi:ceiling-light
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: switch.spalnya_svet_2
            name: Спальня 2
            icon: mdi:ceiling-light-outline
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: switch.basicr2_ded_sonoff_10011f1029
            name: Гостевая
            icon: mdi:ceiling-light
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: switch.basicr2_max_sonoff_10011f28d9
            name: Комната Макса
            icon: mdi:ceiling-light
            tap_action:
              action: toggle
      - type: custom:mushroom-title-card
        title: Детские
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.ewelink_ck_tlsr8656_ss5_01_7014_temperatura
            name: Семён
            icon: mdi:thermometer
            layout: vertical
          - type: custom:mushroom-entity-card
            entity: sensor.ewelink_ck_tlsr8656_ss5_01_7014_temperatura_2
            name: Макс
            icon: mdi:thermometer
            layout: vertical
      - type: custom:mushroom-title-card
        title: Безопасность
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: binary_sensor.hobeian_zg_222z
            name: Протечка (ванная)
            icon: mdi:water-alert
          - type: custom:mushroom-entity-card
            entity: binary_sensor.zbeacon_snzb_05p
            name: Протечка (туалет)
            icon: mdi:water-alert
          - type: custom:mushroom-entity-card
            entity: binary_sensor.balkon_datchik_gaza
            name: Газ (балкон)
            icon: mdi:gas-cylinder-alert
          - type: custom:mushroom-entity-card
            entity: binary_sensor.tz3210_up3pngle_ts0205
            name: Дым
            icon: mdi:smoke-detector
          - type: custom:mushroom-entity-card
            entity: binary_sensor.sonoff_snzb_06p
            name: Ванная PIR
            icon: mdi:motion-sensor
          - type: custom:mushroom-entity-card
            entity: binary_sensor.aoyan_ms01
            name: Коридор PIR
            icon: mdi:walk
      - type: custom:mushroom-entity-card
        entity: weather.forecast_home_assistant
        name: Погода
        icon: mdi:weather-partly-cloudy
        layout: horizontal

