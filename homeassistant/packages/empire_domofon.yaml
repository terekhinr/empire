# SmartIntercom (ESPHome) — открытие и Telegram при звонке.
# Сущности появятся после прошивки: docs/HA_SMARTINTERCOM_ESPHOME.md

script:
  empire_domofon_otkryt:
    alias: "Домофон — открыть"
    description: "Разовое открытие через SmartIntercom (ESPHome accept_call)"
    mode: single
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ states('switch.smartintercom_accept_call') not in
                     ['unknown', 'unavailable', 'none', ''] }}
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.smartintercom_accept_call
        default:
          - service: persistent_notification.create
            data:
              title: "Домофон недоступен"
              message: >-
                Модуль 192.168.1.65 не в сети. Проверьте питание и Wi‑Fi;
                откройте http://192.168.1.65/ в браузере.

automation:
  - id: empire_domofon_telegram
    alias: "Домофон — Telegram при звонке"
    description: "line_detect on → уведомление в Telegram"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.smartintercom_line_detect
        from: "off"
        to: "on"
    action:
      - service: rest_command.empire_telegram
        data:
          message: "Звонок в домофон!"
