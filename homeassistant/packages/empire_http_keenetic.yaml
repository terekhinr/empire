# Доступ к HA через Keenetic KeenDNS (reverse proxy роутера 192.168.1.1).
# Внешний URL задаётся в Настройки → Система → Сеть после настройки роутера.
# См. docs/HA_KEENETIC_REMOTE.md

http:
  use_x_forwarded_for: true
  ip_ban_enabled: true
  login_attempts_threshold: 5
  trusted_proxies:
    - 192.168.1.1
    - 127.0.0.1
    - ::1
    - 172.30.32.0/23
