# Туалет: SONOFF SNZB-06P → light.empire_tualet_svet
# Тайм-аут: OccupancySensing attr 0x0020 (32) = ultrasonic_o_to_u_delay.
# Debounce 1 с на вкл — отсекает короткие ложные импульсы.

automation:
  - id: empire_tualet_sensor_init
    alias: "Туалет — настройка Sonoff присутствия при старте"
    trigger:
      - platform: homeassistant
        event: start
    action:
      - action: select.select_option
        target:
          entity_id: select.tualet_tualet_prisutstvie_chuvstvitelnost_obnaruzheniia
        data:
          option: "Low"
        continue_on_error: true
      # Чувствительность: attr 0x0022 = 34 → Low=1
      - action: zha.set_zigbee_cluster_attribute
        data:
          ieee: "8c:73:da:ff:fe:f2:bd:92"
          endpoint_id: 1
          cluster_id: 1030
          cluster_type: in
          attribute: 34
          value: 1
        continue_on_error: true
      # Тайм-аут после ухода: attr 0x0020 = 32 → 15 с
      - action: zha.set_zigbee_cluster_attribute
        data:
          ieee: "8c:73:da:ff:fe:f2:bd:92"
          endpoint_id: 1
          cluster_id: 1030
          cluster_type: in
          attribute: 32
          value: 15
        continue_on_error: true

  - id: empire_tualet_motion_light_on
    alias: "Туалет — присутствие, свет вкл"
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.sonoff_snzb_06p_3
        to: "on"
        for:
          seconds: 1
    conditions:
      - condition: template
        value_template: >-
          {{ states('light.hobeian_zg_301z') not in ['unavailable', 'unknown', 'none', ''] }}
    actions:
      - action: script.svet_tualet_vkl

  - id: empire_tualet_motion_light_off
    alias: "Туалет — нет присутствия, свет выкл"
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.sonoff_snzb_06p_3
        to: "off"
        for:
          seconds: 15
    conditions:
      - condition: template
        value_template: >-
          {{ states('light.hobeian_zg_301z') not in ['unavailable', 'unknown', 'none', ''] }}
    actions:
      - action: script.svet_tualet_vyk
