# Ванная: TS0052. Прямое on/off для Алисы. Автоматика — empire_motion_light.yaml.

template:
  - light:
      - name: "Ванная свет"
        unique_id: empire_vannaya_svet
        default_entity_id: light.empire_vannaya_svet
        icon: mdi:ceiling-light
        availability: >
          {{ states('light.tz3000_mgusv51k_ts0052') not in ['unavailable', 'unknown', 'none'] }}
        state: >
          {{ is_state('light.tz3000_mgusv51k_ts0052', 'on') }}
        level: >
          {{ state_attr('light.tz3000_mgusv51k_ts0052', 'brightness') | int(0) }}
        turn_on:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.rezhim_ushel
                - input_boolean.rezhim_otpusk
          - action: light.turn_on
            target:
              entity_id: light.tz3000_mgusv51k_ts0052
            data:
              brightness_pct: >
                {% if brightness_pct is defined %}
                  {{ brightness_pct | int }}
                {% elif brightness is defined %}
                  {{ [((brightness | int) * 100 // 255), 1] | max }}
                {% else %}
                  100
                {% endif %}
        turn_off:
          - action: light.turn_off
            target:
              entity_id: light.tz3000_mgusv51k_ts0052
        set_level:
          - action: light.turn_on
            target:
              entity_id: light.tz3000_mgusv51k_ts0052
            data:
              brightness: "{{ brightness }}"

automation:
  - id: empire_vannaya_dimmer_power_restore
    alias: "Ванная — диммер снова в сети"
    mode: single
    triggers:
      - trigger: state
        entity_id: light.tz3000_mgusv51k_ts0052
        from:
          - unavailable
          - unknown
    actions:
      - delay:
          seconds: 5
      - action: homeassistant.update_entity
        target:
          entity_id:
            - light.tz3000_mgusv51k_ts0052
            - light.empire_vannaya_svet
      - if:
          - condition: state
            entity_id: binary_sensor.sonoff_snzb_06p
            state: "on"
        then:
          - action: light.turn_on
            target:
              entity_id: light.empire_vannaya_svet
            data:
              brightness_pct: 100
