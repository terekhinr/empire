# Ezviz: уведомления о движении → Telegram
# После добавления интеграции Ezviz переименуйте сущности (см. docs/HA_EZVIZ_WALL_DASHBOARD.md):
#   camera.ezviz_prihozhaya + binary_sensor.ezviz_prihozhaya_motion_alarm
#   camera.ezviz_podezd + binary_sensor.ezviz_podezd_motion_alarm
#
# Имена binary_sensor зависят от прошивки; проверьте в Настройки → Устройства → Ezviz.

automation:
  - id: empire_ezviz_motion_prihozhaya
    alias: "Ezviz — движение (прихожая) → Telegram"
    description: "Срабатывает при движении на камере «Прихожая»"
    trigger:
      - platform: state
        entity_id: binary_sensor.ezviz_prihozhaya_motion_alarm
        from: "off"
        to: "on"
    action:
      - service: rest_command.empire_telegram
        data:
          message: "Камера «Прихожая»: движение"
    mode: single

  - id: empire_ezviz_motion_podezd
    alias: "Ezviz — движение (подъезд) → Telegram"
    description: "Срабатывает при движении на камере «Подъезд»"
    trigger:
      - platform: state
        entity_id: binary_sensor.ezviz_podezd_motion_alarm
        from: "off"
        to: "on"
    action:
      - service: rest_command.empire_telegram
        data:
          message: "Камера «Подъезд»: движение"
    mode: single

  - id: empire_ezviz_motion_otpusk
    alias: "Ezviz — движение в отпуске → Telegram"
    description: "Любая камера Ezviz при включённом режиме «Отпуск»"
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.ezviz_prihozhaya_motion_alarm
          - binary_sensor.ezviz_podezd_motion_alarm
        from: "off"
        to: "on"
    condition:
      - condition: state
        entity_id: input_boolean.rezhim_otpusk
        state: "on"
    action:
      - service: rest_command.empire_telegram
        data:
          message: >-
            Отпуск: движение на камере «{{ trigger.to_state.attributes.friendly_name | default('Ezviz') }}»
    mode: queued
    max: 5
