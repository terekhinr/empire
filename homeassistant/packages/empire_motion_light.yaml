# Ванная: SNZB-06P → light.empire_vannaya_svet
#
# - presence → on (любой переход в on)
# - presence off 15с → off
# - ZHA Low/15 каждый час (UI/quirk откатывает на Medium/60)
# БЕЗ recover и БЕЗ короткого max_on (10 мин + залипший occupancy = темно без edge)
# НЕ писать binary_sensor.* через /api/states

template:
  - binary_sensor:
      - name: "Ванная — ночь (расписание)"
        unique_id: empire_vannaya_dim_night
        default_entity_id: binary_sensor.empire_vannaya_dim_night
        icon: mdi:brightness-4
        state: >
          {% set ts = as_timestamp(now()) %}
          {% set h = ts | timestamp_custom('%H', true, 'Europe/Moscow') | int(0) %}
          {% set min = ts | timestamp_custom('%M', true, 'Europe/Moscow') | int(0) %}
          {% set mins = h * 60 + min %}
          {{ mins >= 60 and mins < 351 }}

automation:
  - id: empire_vannaya_sensor_init
    alias: "Ванная — настройка Sonoff присутствия при старте"
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        hours: "/1"
    actions:
      - delay:
          seconds: 10
      - action: zha.set_zigbee_cluster_attribute
        data:
          ieee: "8c:73:da:ff:fe:b2:f7:c0"
          endpoint_id: 1
          cluster_id: 1030
          cluster_type: in
          attribute: 32
          value: 15
        continue_on_error: true
      - action: zha.set_zigbee_cluster_attribute
        data:
          ieee: "8c:73:da:ff:fe:b2:f7:c0"
          endpoint_id: 1
          cluster_id: 1030
          cluster_type: in
          attribute: 34
          value: 1
        continue_on_error: true

  - id: empire_vannaya_motion_light_on
    alias: "Ванная — присутствие, свет вкл"
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.sonoff_snzb_06p
        to: "on"
    conditions:
      - condition: template
        value_template: >-
          {{ states('light.tz3000_mgusv51k_ts0052') not in
             ['unavailable', 'unknown'] }}
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.empire_vannaya_dim_night
                state: "on"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.empire_vannaya_svet
                data:
                  brightness_pct: 20
              - delay:
                  milliseconds: 400
              - action: light.turn_on
                target:
                  entity_id: light.empire_vannaya_svet
                data:
                  brightness_pct: 20
        default:
          - action: light.turn_on
            target:
              entity_id: light.empire_vannaya_svet
            data:
              brightness_pct: 100
          - delay:
              milliseconds: 400
          - action: light.turn_on
            target:
              entity_id: light.empire_vannaya_svet
            data:
              brightness_pct: 100

  - id: empire_vannaya_motion_light_off
    alias: "Ванная — нет присутствия, свет выкл"
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.sonoff_snzb_06p
        to: "off"
        for:
          seconds: 15
    conditions:
      - condition: state
        entity_id: binary_sensor.sonoff_snzb_06p
        state: "off"
    actions:
      - action: light.turn_off
        target:
          entity_id:
            - light.empire_vannaya_svet
            - light.tz3000_mgusv51k_ts0052

  - id: empire_vannaya_dim_night_brightness
    alias: "Ванная — смена день/ночь, яркость"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.empire_vannaya_dim_night
    conditions:
      - condition: state
        entity_id: light.empire_vannaya_svet
        state: "on"
      - condition: state
        entity_id: binary_sensor.sonoff_snzb_06p
        state: "on"
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.empire_vannaya_dim_night
                state: "on"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.empire_vannaya_svet
                data:
                  brightness_pct: 20
                  transition: 1
        default:
          - action: light.turn_on
            target:
              entity_id: light.empire_vannaya_svet
            data:
              brightness_pct: 100
              transition: 1
