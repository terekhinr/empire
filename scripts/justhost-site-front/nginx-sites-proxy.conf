# Temporary RU front on JustHost → origin Aeza (apps stay on 138.124.90.47)
# TLS terminates here; HTTP to origin with X-Forwarded-Proto https.

upstream aeza_http {
    server 138.124.90.47:80;
    keepalive 16;
}

# ACME + optional HTTP (redirect to HTTPS)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name gdepar.ru www.gdepar.ru neverretire.ru www.neverretire.ru
                par.neverretire.ru snegirinegiri.ru www.snegirinegiri.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Shared proxy bits
map $host $aeza_ok {
    default 0;
    gdepar.ru 1;
    www.gdepar.ru 1;
    neverretire.ru 1;
    www.neverretire.ru 1;
    par.neverretire.ru 1;
    snegirinegiri.ru 1;
    www.snegirinegiri.ru 1;
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name neverretire.ru www.neverretire.ru;

    ssl_certificate     /etc/empire-front/certs/neverretire.ru/fullchain.pem;
    ssl_certificate_key /etc/empire-front/certs/neverretire.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://aeza_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}

