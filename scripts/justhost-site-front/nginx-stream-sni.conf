# Include from http-less context: put inside top-level `stream { }` in nginx.conf
# SNI split: empire domains → local HTTPS :8443; everything else (VLESS Reality) → xray :4443

map $ssl_preread_server_name $empire_sni_upstream {
    gdepar.ru                 web8443;
    www.gdepar.ru             web8443;
    neverretire.ru            web8443;
    www.neverretire.ru        web8443;
    par.neverretire.ru        web8443;
    snegirinegiri.ru          web8443;
    www.snegirinegiri.ru      web8443;
    default                   xray4443;
}

upstream web8443 {
    server 127.0.0.1:8443;
}

upstream xray4443 {
    server 127.0.0.1:4443;
}

server {
    listen 443;
    listen [::]:443;
    proxy_pass $empire_sni_upstream;
    ssl_preread on;
    proxy_connect_timeout 5s;
    proxy_timeout 86400s;
}
