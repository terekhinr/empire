<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" preserveAspectRatio="none">
  <defs>
    <radialGradient id="parch" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%"   stop-color="#fbf2dc"/>
      <stop offset="55%"  stop-color="#f0e3c2"/>
      <stop offset="100%" stop-color="#dec79c"/>
    </radialGradient>
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.30  0 0 0 0 0.20  0 0 0 0 0.10  0 0 0 0.20 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="stain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.012" numOctaves="2" seed="5"/>
      <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.30  0 0 0 0 0.15  0 0 0 0.18 0"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#parch)"/>
  <rect width="600" height="400" filter="url(#stain)"/>
  <rect width="600" height="400" fill="#f0e3c2" filter="url(#paperGrain)" opacity="0.7"/>
</svg>
