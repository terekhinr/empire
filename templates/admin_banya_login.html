<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Где Пар · вход в модерацию</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#1b1410 url('/static/gdepar/textures/wood-dark.svg') repeat;font:14px/1.5 system-ui,Segoe UI,sans-serif;color:#f6e9d4;}
  form{background:#2a1f17;border:1px solid #5a3f2a;border-radius:10px;padding:32px 36px;min-width:280px;
       box-shadow:0 12px 40px rgba(0,0,0,.4);}
  h1{margin:0 0 18px;font:600 22px/1.2 Georgia,serif;color:#f6e9d4;letter-spacing:.02em;}
  label{display:block;font-size:13px;color:#c9b69a;margin-bottom:6px;}
  input[type=password]{width:100%;box-sizing:border-box;background:#1b1410;color:#f6e9d4;
       border:1px solid #5a3f2a;border-radius:6px;padding:10px 12px;font-size:14px;}
  input[type=password]:focus{outline:none;border-color:#a37748;}
  button{margin-top:14px;width:100%;background:#a37748;color:#1b1410;border:0;border-radius:6px;
       padding:11px;font-weight:600;font-size:14px;cursor:pointer;}
  button:hover{background:#c39059;}
  .err{margin-top:10px;color:#ff8a7a;font-size:13px;}
  .hint{margin-top:18px;color:#7a6b54;font-size:12px;text-align:center;}
</style>
</head>
<body>
<form method="post" action="/admin/banya/login" autocomplete="off">
  <h1>Модерация · Где Пар</h1>
  <label for="token">Токен доступа</label>
  <input id="token" name="token" type="password" autofocus required>
  <button type="submit">Войти</button>
  {% if error %}<div class="err">Неверный токен.</div>{% endif %}
  <div class="hint">Токен задан в .env (BANYA_ADMIN_TOKEN).</div>
</form>
</body>
</html>
